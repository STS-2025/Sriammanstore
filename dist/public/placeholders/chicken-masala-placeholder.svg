<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="100%" stop-color="#fde8d7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="24" />
  <rect x="12" y="12" width="376" height="376" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 6" rx="20" opacity="0.4" />

  <!-- Central Badge -->
  <g transform="translate(200, 150)">
    <circle r="60" fill="url(#cardGrad)" />
    <!-- Spice Bowl / Masala Icon -->
    <path d="M -30 -5 Q 0 -35 30 -5 Q 35 25 0 35 Q -35 25 -30 -5 Z" fill="#ffffff" opacity="0.95" />
    <ellipse cx="0" cy="-6" rx="26" ry="10" fill="#fed7aa" />
    <circle cx="-8" cy="-8" r="3" fill="#c2410c" />
    <circle cx="6" cy="-6" r="2.5" fill="#c2410c" />
    <circle cx="0" cy="-4" r="2" fill="#9a3412" />
  </g>

  <!-- Text Details -->
  <text x="200" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="bold" fill="#7c2d12">
    Sakthi Chicken Masala
  </text>
  <text x="200" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#9a3412">
    சக்தி சிக்கன் மசாலா
  </text>

  <!-- Notice Badge -->
  <rect x="50" y="296" width="300" height="32" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="1.5" />
  <text x="200" y="317" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#c2410c">
    Neutral Placeholder · Development
  </text>

  <text x="200" y="352" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9a3412" opacity="0.8">
    Production Puliyogare photo excluded per data audit
  </text>
</svg>

